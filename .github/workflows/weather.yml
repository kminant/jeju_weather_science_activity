name: Update Weather

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-weather:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          pip install requests

      - name: Run update_weather.py
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          python scripts/update_weather.py

      - name: Commit weather.json
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git diff --cached --quiet || git commit -m "Update weather"

          git push
